# config/sources-example.yml
# where to fetch data from

# what follows is the example definition of a source; you may define
# as many as you desire

# name
example_source:
  # under what username to publish the words
  user: foobar
  # a URL to a downloadable TSV or JSON file, or a path to a local file
  # (relative to the Toadua root)
  source: 'https://example.com/my_dict.tsv'
  format: tsv   # or 'json'
  # for TSV files: how many rows to skip before processing
  # this field can only be left empty in case of JSON files
  skip: 1
  # these patterns shape the definitions of words based on the
  # values of the columns found in the source file. 0-indexed.
  # with a column like: a\tb\tc\td\te\tf\t, these patterns would
  # produce two entries: 'a: b c!' and 'd: e is not f'
  # in case of JSON files, use numbers or field names; i.e., both
  # %(0) and %(english) is fine
  patterns:
    - head: '%(0)'
      body: '%(1) %(2)!'
    - head: '%(3)'
      body: '%(4) is not %(5)'

# a local dump of a Toadua database (e.g. the `results` array of a search
# API response), for testing with many entries in several scopes. entries
# go into the scope given by the `scope` pattern, or 'en' if there is none
local_dump:
  user: dump
  source: 'data/dump.json'
  format: json
  patterns:
    - scope: '%(scope)'
      head: '%(head)'
      body: '%(body)'
      gloss: '%(gloss)'
      type: '%(type)'
      frame: '%(frame)'
      pronominal_class: '%(pronominal_class)'
      subject: '%(subject)'
      distribution: '%(distribution)'
